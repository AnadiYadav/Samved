<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRSC - ISRO</title>
    <link rel="stylesheet" href="./main.css">    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script> 
</head>
<body>
    <!-- Main Website Header -->
    <header class="nrsc-header">
        <img src="/frontend/static/images/nrsc-logo.png" alt="NRSC Logo" class="nrsc-logo">
        <h1 id="firstheading">National Remote Sensing Centre</h1>
        <nav class="nrsc-nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="nrsc-content">
        
    </main>

    <!-- Chat Widget Container -->
    <div class="chat-widget">
        <!-- Welcome Bubble (positioned above chat icon) -->
        <div class="welcome-bubble">Hi! I'm Samved. Click to chat!</div>
        
        <!-- Chat Icon (always visible) -->
        <div class="chat-icon" onclick="toggleChat()">
            <img src="/frontend/static/images/chatbot-icon.gif" alt="Chat Icon">
        </div>
        
        <!-- Chat Window (initially hidden) -->
        <div class="chat-window">
            <div class="chat-header">
                <h3 id="click-head">Samved - The EO Chatbot</h3>
                <div class="chat-header-buttons">
                    <button onclick="toggleMaximize()" class="maximize-btn">□</button>
                    <button onclick="toggleChat()" class="minimize-btn">−</button>
                </div>
            </div>
            <div class="chat-body" id="chatBody">
                <div class="message bot-message">Welcome! Ask me about NRSC, ISRO, Remote Sensing Data Products, Policies, Services, applications and more.</div>
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" 
                       placeholder="Type your question..." 
                       class="chat-input-field"
                       onkeypress="handleEnter(event)">
                <button onclick="sendMessage()" class="send-btn">Submit</button>
            </div>
        </div>
    </div>

    <script src="\index.js"></script>
</body>
</html>
